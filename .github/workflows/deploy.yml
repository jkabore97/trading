name: Deploy

# Deploys the Worker and the Pages dashboard on merge to main, gated on the full
# check suite passing first (the `check` job must succeed before `deploy` runs).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - scoped token (Workers Scripts, D1, R2, Pages edit)
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare account id
# These are GitHub encrypted secrets — never committed. See GOING_LIVE.md.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  check:
    name: gate (lint / typecheck / test / parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test

  deploy:
    name: deploy worker + pages
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations (remote)
        working-directory: packages/worker
        run: pnpm exec wrangler d1 migrations apply trading --remote

      - name: Deploy Worker
        working-directory: packages/worker
        run: pnpm exec wrangler deploy

      - name: Build dashboard
        run: pnpm --filter @trading/dashboard run build

      - name: Deploy Pages dashboard
        working-directory: apps/dashboard
        run: pnpm exec wrangler pages deploy public --project-name trading-dashboard
